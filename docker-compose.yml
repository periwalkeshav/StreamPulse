name: streampulse

# ---------------------------------------------------------------------------
#  StreamPulse - the whole stack in one command:
#
#      docker compose up -d --build
#
#  UI map:  Kafka UI  http://localhost:8080
#           Grafana   http://localhost:3000   (admin / admin)
#           Airflow   http://localhost:8081   (admin / admin)
#           Spark UI  http://localhost:4040
# ---------------------------------------------------------------------------

x-pipeline-env: &pipeline-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RAW_TOPIC: raw-events
  PROCESSED_TOPIC: processed-events
  DLQ_TOPIC: dlq-events
  ALERTS_TOPIC: alerts
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: streampulse
  POSTGRES_USER: streampulse
  POSTGRES_PASSWORD: streampulse

services:
  # ----------------------------------------------------------------- Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: streampulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      # `srvr` rather than `ruok`: ZooKeeper 3.5+ only whitelists `srvr` by
      # default, and cp-zookeeper does not translate the whitelist env var.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [streampulse]

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streampulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # in-network listener (also exposed for debugging)
      - "29092:29092"  # host listener - use this from your laptop
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker local dev: every internal topic must fit on one node.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [streampulse]

  # Creates the four topics with the partition counts and retention documented
  # in schema_registry.md, then exits.
  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streampulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    networks: [streampulse]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: streampulse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streampulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [streampulse]

  # -------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: streampulse-postgres
    environment:
      POSTGRES_DB: streampulse
      POSTGRES_USER: streampulse
      POSTGRES_PASSWORD: streampulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only bootstraps the separate `airflow` metadata database; the
      # StreamPulse schema itself is applied by the `migrate` service so that a
      # schema change also reaches an already-initialised volume.
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streampulse -d streampulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [streampulse]

  # Applies schema.sql idempotently on every `up` (covers an existing volume
  # created before a schema change) and then exits.
  migrate:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: streampulse-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pipeline-env
    volumes:
      - ./sql:/app/sql:ro
    command: ["python", "sql/migrate.py", "--verify"]
    networks: [streampulse]

  # ------------------------------------------------------------- pipeline
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: streampulse-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *pipeline-env
      EVENTS_PER_SECOND: "1000"
      DURATION_SECONDS: "0"
      MALFORMED_RATE: "0.01"
      ANOMALY_RATE: "0.005"
      LATE_EVENT_RATE: "0.01"
      KAFKA_BATCH_SIZE: "65536"
      KAFKA_LINGER_MS: "20"
      KAFKA_COMPRESSION: "lz4"
    command: ["python", "producer/producer.py"]
    restart: unless-stopped
    networks: [streampulse]

  spark-consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: streampulse-spark-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "4040:4040"  # Spark UI
    environment:
      <<: *pipeline-env
      SPARK_DRIVER_MEMORY: 2g
      SPARK_LOCAL_CORES: "4"
      SHUFFLE_PARTITIONS: "4"
      TRIGGER_INTERVAL: "10 seconds"
      WINDOW_DURATION: "5 minutes"
      WATERMARK_DELAY: "10 minutes"
      SESSION_GAP: "2 minutes"
      SESSION_WATERMARK: "2 minutes"
      ANOMALY_SIGMA: "3.0"
      STARTING_OFFSETS: "latest"
      CHECKPOINT_LOCATION: /opt/streampulse/checkpoints
    volumes:
      - spark-checkpoints:/opt/streampulse/checkpoints
    restart: unless-stopped
    networks: [streampulse]

  dlq-monitor:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: streampulse-dlq-monitor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pipeline-env
      DLQ_REPORT_INTERVAL: "60"
      DLQ_ALERT_THRESHOLD: "100"
    command: ["dlq"]
    restart: unless-stopped
    networks: [streampulse]

  # -------------------------------------------------------------- Grafana
  grafana:
    image: grafana/grafana:10.4.2
    container_name: streampulse-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [streampulse]

  # -------------------------------------------------------------- Airflow
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: streampulse-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://streampulse:streampulse@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW_CONN_STREAMPULSE_POSTGRES: postgresql://streampulse:streampulse@postgres:5432/streampulse
      PYTHONPATH: /opt/airflow/dags
      # Consumed by dbt/profiles.yml, which resolves every value via env_var so
      # the same profile works from the host, the dbt container and here.
      <<: *pipeline-env
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET: docker
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sql:/opt/airflow/sql:ro
      - ./dbt:/opt/airflow/dbt
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Stream --lastname Pulse --role Admin --email admin@streampulse.local || true
    networks: [streampulse]

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: streampulse-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sql:/opt/airflow/sql:ro
      - ./dbt:/opt/airflow/dbt
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [streampulse]

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: streampulse-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./sql:/opt/airflow/sql:ro
      - ./dbt:/opt/airflow/dbt
    command: scheduler
    restart: unless-stopped
    networks: [streampulse]

  # ------------------------------------------------- load testing (profile)
  locust:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: streampulse-locust
    profiles: ["loadtest"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8089:8089"
    environment:
      <<: *pipeline-env
    command: ["locust", "-f", "loadtest/locustfile.py", "--host", "kafka://kafka:9092"]
    networks: [streampulse]

volumes:
  postgres-data:
  grafana-data:
  spark-checkpoints:

networks:
  streampulse:
    name: streampulse
